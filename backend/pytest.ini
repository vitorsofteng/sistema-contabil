[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personalizados
markers =
    unit: Testes unitários puros (sem dependências externas)
    integration: Testes de integração (API, banco de dados)
    e2e: Testes end-to-end (fluxos completos)
    slow: Testes lentos (>1s)
    load: Testes de carga e performance

# Opções padrão
addopts = 
    -v 
    --tb=short 
    -p no:asyncio
    --strict-markers

# Diretório de resultados
junit_family = xunit2

# Ignorar warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning

# Timeout padrão (segundos)
timeout = 30

# Configuração de logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
