server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # runtime-config.js - nunca cachear
    location = /runtime-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ==========================================
    # BACKEND API PROXY
    # Todas as rotas do backend sao proxeadas.
    # __BACKEND_URL__ e substituido pelo entrypoint.
    # ==========================================
    location ~ ^/(api|auth|empresas|exportacoes|importacoes|importacao|importar|dashboard|alertas|analise|compartilhado|convites|cupom|health|meu-papel|organizacoes|papeis|planos|relatorios|setores|webhooks)(/|$) {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }

    # Frontend SPA - tudo que nao e API vai para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache estatico (JS/CSS do build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
