version: '3.8'

# =============================================================================
# DOCKER COMPOSE - SISTEMA CONTÁBIL v2.9.0
# =============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: contabil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contabil
      POSTGRES_PASSWORD: contabil123
      POSTGRES_DB: contabil_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabil -d contabil_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - contabil-network

  # Backend API (Python/FastAPI)
  backend:
    build: ./backend
    container_name: contabil-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - USE_POSTGRES=true
      - POSTGRES_USER=contabil
      - POSTGRES_PASSWORD=contabil123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=contabil_db
      - DATABASE_URL=postgresql://contabil:contabil123@postgres:5432/contabil_db
      - ENV=development
    volumes:
      - ./backend/api:/app/api
      - ./backend/engine:/app/engine
      - ./backend/auth:/app/auth
      - ./backend/db:/app/db
      - ./backend/reports:/app/reports
      - ./backend/importers:/app/importers
      - ./backend/billing:/app/billing
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contabil-network

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: contabil-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - DOCKER=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    networks:
      - contabil-network

networks:
  contabil-network:
    driver: bridge

volumes:
  postgres-data:
